<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>BootKode Offline</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Manrope, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f8fafc;
            color: #0f172a;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(520px, 100%);
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 24px 70px rgb(15 23 42 / 0.12);
            padding: 28px;
        }

        .mark {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #0f766e;
            color: #ffffff;
            display: grid;
            place-items: center;
            font-weight: 900;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.75rem, 7vw, 2.5rem);
            line-height: 1.05;
        }

        p {
            margin: 14px 0 0;
            color: #475569;
            line-height: 1.7;
        }

        a {
            margin-top: 22px;
            display: inline-flex;
            min-height: 46px;
            align-items: center;
            border-radius: 8px;
            background: #0f172a;
            color: #ffffff;
            padding: 0 18px;
            text-decoration: none;
            font-weight: 800;
        }
    </style>
</head>
<body>
    <main>
        <div class="mark">BK</div>
        <h1>You are offline.</h1>
        <p>BootKode is ready as an installable learning app. Reconnect to load fresh lessons, mentorship, certificates, and dashboard data.</p>
        <a href="/">Try again</a>
    </main>
</body>
</html>
