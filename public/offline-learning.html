<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>BootKode Offline Learning</title>
    <script src="/js/offline-learning.js"></script>
    <style>
        :root {
            color-scheme: light;
            font-family: Manrope, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f8fafc;
        }

        a {
            color: inherit;
        }

        .empty {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            text-align: center;
        }

        .empty > * {
            max-width: 520px;
        }

        .mark,
        .brand {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            background: #0f766e;
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 900;
        }

        .empty a,
        .sync-btn,
        .online-link,
        .complete-btn {
            display: inline-flex;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 8px;
            background: #0f172a;
            color: #fff;
            padding: 0 16px;
            text-decoration: none;
            font-weight: 800;
            cursor: pointer;
        }

        .reader-app {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 330px minmax(0, 1fr);
        }

        .reader-nav {
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            border-right: 1px solid #e2e8f0;
            background: #fff;
            padding: 20px;
        }

        .reader-nav h1 {
            margin: 18px 0 8px;
            font-size: 1.25rem;
            line-height: 1.25;
        }

        .reader-nav p,
        .description,
        .lesson-meta {
            color: #475569;
            line-height: 1.6;
        }

        .progress {
            height: 8px;
            border-radius: 999px;
            background: #e2e8f0;
            overflow: hidden;
            margin: 12px 0 16px;
        }

        .progress span {
            display: block;
            height: 100%;
            border-radius: inherit;
            background: #0f766e;
        }

        .sync-btn,
        .online-link {
            width: 100%;
            margin-bottom: 10px;
        }

        .online-link {
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #0f172a;
        }

        .reader-section {
            margin-top: 22px;
        }

        .reader-section h2 {
            margin: 0 0 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #64748b;
        }

        .lesson-link {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: transparent;
            color: #0f172a;
            padding: 10px;
            text-align: left;
            cursor: pointer;
        }

        .lesson-link.active {
            border-color: #0f766e;
            background: #ecfdf5;
        }

        .lesson-link i {
            color: #0f766e;
            font-style: normal;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .reader-content {
            min-width: 0;
            padding: 28px;
        }

        .lesson-panel {
            max-width: 980px;
            margin: 0 auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #fff;
            padding: clamp(20px, 5vw, 40px);
            box-shadow: 0 24px 60px rgb(15 23 42 / 0.08);
        }

        .lesson-panel h1 {
            margin: 8px 0 0;
            font-size: clamp(2rem, 6vw, 3.75rem);
            line-height: 1.03;
            letter-spacing: 0;
        }

        .lesson-panel h2 {
            margin-top: 28px;
        }

        .lesson-body {
            margin-top: 24px;
            color: #1e293b;
            line-height: 1.8;
            font-size: 1.03rem;
        }

        .lesson-body img,
        .resource-card img,
        .resource-card video {
            max-width: 100%;
            border-radius: 8px;
        }

        .resources {
            display: grid;
            gap: 12px;
        }

        .resource-card {
            display: block;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
            padding: 14px;
            text-decoration: none;
        }

        .resource-card audio,
        .resource-card video {
            width: 100%;
            margin-top: 10px;
        }

        .resource-card.link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .complete-btn {
            margin-top: 28px;
            background: #0f766e;
        }

        .complete-btn.done {
            background: #16a34a;
        }

        @media (max-width: 860px) {
            .reader-app {
                grid-template-columns: 1fr;
            }

            .reader-nav {
                position: static;
                height: auto;
                border-right: 0;
                border-bottom: 1px solid #e2e8f0;
            }

            .reader-content {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="offline-reader-root"></div>
</body>
</html>
